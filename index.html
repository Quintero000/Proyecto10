
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto 10 JPQ</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <div class="contenedor">

        <div class="pestanas">
            <button class="pestana activa" data-pestana="1">First Tab</button>
            <button class="pestana" data-pestana="2">Second Tab</button>
            <button class="pestana" data-pestana="3">Third Tab</button>
            <button class="pestana" data-pestana="4">Fourth Tab</button>
        </div>

        <p>
            Haz clic en cada pestaña para ver su contenido.
            La primera pestaña está activa por defecto.
        </p>

        <div class="contenido">
            <div class="panel activo" id="panel-1">
                First Tab content to be displayed here.
            </div>

            <div class="panel" id="panel-2">
                Second Tab content to be displayed here.
            </div>

            <div class="panel" id="panel-3">
                Third Tab content to be displayed here.
            </div>

            <div class="panel" id="panel-4">
                Fourth Tab content to be displayed here.
            </div>
        </div>


    </div>

    <script src="jscript.js"></script>
</body>

</html>
